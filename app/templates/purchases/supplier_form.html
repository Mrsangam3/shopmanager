{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'New' }} supplier · ShopManager{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3">{{ 'Edit supplier' if supplier else 'Add supplier' }}</h4>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input name="name" class="form-control" maxlength="120" value="{{ values.get('name', '') }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input name="phone" class="form-control" maxlength="30" value="{{ values.get('phone', '') }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input name="email" type="email" class="form-control" maxlength="120" value="{{ values.get('email', '') }}">
        </div>
        <button class="btn btn-primary">Save</button>
        <a class="btn btn-link" href="{{ url_for('purchases.suppliers') }}">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
