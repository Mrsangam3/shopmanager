{% extends "base.html" %}
{% block title %}New sale · ShopManager{% endblock %}
{% block content %}
<div class="row g-4">

  <div class="col-lg-6">
    <h5>Products</h5>
    <input id="search" class="form-control mb-2" placeholder="Search name or SKU" autofocus>
    <div id="product-list" class="list-group" style="max-height: 60vh; overflow-y: auto;"></div>
  </div>

  <div class="col-lg-6">
    <h5>Cart</h5>
    <form method="post" id="sale-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <table class="table table-sm bg-white align-middle">
        <thead><tr><th>Item</th><th>Qty</th><th class="text-end">Total</th><th></th></tr></thead>
        <tbody id="cart-body"></tbody>
        <tfoot>
          <tr>
            <th colspan="2" class="text-end">Grand total</th>
            <th class="text-end" id="total">0.00</th>
            <th></th>
          </tr>
        </tfoot>
      </table>
      <input name="customer_name" class="form-control mb-3" maxlength="120"
             placeholder="Customer name (optional)" value="{{ customer }}">
      <button id="submit-btn" class="btn btn-success w-100" disabled>Complete sale</button>
    </form>
  </div>
</div>

<script id="products-data" type="application/json">{{ products|tojson|safe }}</script>
<script id="prefill-data" type="application/json">{{ prefill|tojson|safe }}</script>
<script>
  const PRODUCTS = JSON.parse(document.getElementById("products-data").textContent || "[]");
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const prefill = JSON.parse(document.getElementById("prefill-data").textContent || "[]");

  // cart restored after a failed submit; drop unknown products and clamp to stock
  let cart = prefill
    .filter(l => l && Number.isInteger(l.id) && byId[l.id])
    .map(l => ({
      id: Number(l.id),
      qty: Math.max(1, Math.min(Number(l.qty) || 1, byId[l.id].stock))
    }));

  const listEl = document.getElementById("product-list");
  const cartBody = document.getElementById("cart-body");
  const totalEl = document.getElementById("total");
  const searchEl = document.getElementById("search");
  const submitBtn = document.getElementById("submit-btn");

  // display only: the server recalculates every price itself
  const money = n => n.toLocaleString(undefined,
        { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function renderList() {
    const q = searchEl.value.trim().toLowerCase();
    listEl.replaceChildren();
    PRODUCTS
      .filter(p => !q || (p.name || "").toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q))
      .slice(0, 50)
      .forEach(p => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "list-group-item list-group-item-action d-flex justify-content-between";
        const left = document.createElement("span");
        left.textContent = p.name + " · " + p.sku;
        const right = document.createElement("span");
        right.className = "text-muted small";
        right.textContent = money(Number(p.price)) + " · " + p.stock + " in stock";
        btn.append(left, right);
        btn.addEventListener("click", () => addToCart(p.id));
        listEl.appendChild(btn);
      });
  }

  function addToCart(id) {
    const product = byId[id];
    if (!product || product.stock <= 0) return;
    const line = cart.find(l => l.id === id);
    if (line) {
      line.qty = Math.min(line.qty + 1, product.stock);
    } else {
      cart.push({ id, qty: 1 });
    }
    renderCart();
  }

  function updateTotal() {
    const total = cart.reduce((sum, l) => {
      const product = byId[l.id];
      if (!product) return sum;
      return sum + Number(product.price) * l.qty;
    }, 0);
    totalEl.textContent = money(total);
    submitBtn.disabled = cart.length === 0;
  }

  function renderCart() {
    cartBody.replaceChildren();
    cart.forEach(line => {
      const p = byId[line.id];
      if (!p) return;
      const tr = document.createElement("tr");

      const nameTd = document.createElement("td");
      nameTd.textContent = p.name;
      const idInput = document.createElement("input");
      idInput.type = "hidden"; idInput.name = "product_id"; idInput.value = p.id;
      nameTd.appendChild(idInput);

      const qtyTd = document.createElement("td");
      const qtyInput = document.createElement("input");
      qtyInput.type = "number"; qtyInput.name = "quantity";
      qtyInput.min = 1; qtyInput.max = p.stock; qtyInput.value = line.qty;
      qtyInput.className = "form-control form-control-sm";
      qtyInput.style.width = "5rem";
      qtyTd.appendChild(qtyInput);

      const totalTd = document.createElement("td");
      totalTd.className = "text-end";
      totalTd.textContent = money(Number(p.price) * line.qty);

      const rmTd = document.createElement("td");
      const rm = document.createElement("button");
      rm.type = "button";
      rm.className = "btn btn-outline-danger btn-sm";
      rm.textContent = "×";
      rm.addEventListener("click", () => { cart = cart.filter(l => l !== line); renderCart(); });
      rmTd.appendChild(rm);

      qtyInput.addEventListener("input", () => {
        const v = Number.parseInt(qtyInput.value, 10);
        if (!Number.isInteger(v) || v < 1) {
          qtyInput.value = line.qty;
          return;
        }
        line.qty = Math.min(v, p.stock);
        qtyInput.value = line.qty;
        totalTd.textContent = money(Number(p.price) * line.qty);
        updateTotal();
      });
      qtyInput.addEventListener("change", () => { qtyInput.value = line.qty; });

      tr.append(nameTd, qtyTd, totalTd, rmTd);
      cartBody.appendChild(tr);
    });
    updateTotal();
  }

  // Pressing Enter in a quantity box must not complete the sale by accident
  document.getElementById("sale-form").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.tagName === "INPUT") e.preventDefault();
  });

  searchEl.addEventListener("input", renderList);
  renderList();
  renderCart();
</script>
{% endblock %}
